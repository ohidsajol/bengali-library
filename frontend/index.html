<!DOCTYPE html>
<html lang="en" data-theme="parchment">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Bengali Digital Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+Bengali:wght@400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="app">

  <nav id="topbar">
    <div id="nav-left">
      <button id="btn-back"    class="nav-btn" title="Back (Alt+←)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-forward" class="nav-btn" title="Forward (Alt+→)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 2l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-home"    class="nav-btn home-btn" title="Home">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 8l5.5-5.5L13 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="4" y="8" width="7" height="5.5" rx="1" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>

    <div id="search-wrap">
      <svg class="search-icon" width="15" height="15" viewBox="0 0 15 15" fill="none">
        <circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 10l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input id="search-input" type="text" placeholder="Search books or authors…" autocomplete="off" spellcheck="false"/>
    </div>

    <div id="nav-right">
      <button class="nav-pill" id="nav-recents" title="Recently read">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 3.5v3l2 1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Recents
      </button>
      <button class="nav-pill" id="nav-favs" title="Favourites">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 10.5S1.5 7 1.5 4a2.5 2.5 0 015 0 2.5 2.5 0 015 0c0 3-5 6.5-5 6.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        Favs
      </button>
      <!-- Theme switcher -->
      <div id="theme-wrap">
        <button class="nav-pill" id="theme-btn" title="Switch theme">🎨 Theme</button>
        <div id="theme-dropdown" class="hidden">
          <button class="theme-opt" data-theme="parchment">📜 Parchment</button>
          <button class="theme-opt" data-theme="dark">🌑 Dark</button>
          <button class="theme-opt" data-theme="ocean">🌊 Ocean</button>
          <button class="theme-opt" data-theme="forest">🌲 Forest</button>
          <button class="theme-opt" data-theme="slate">🪨 Slate</button>
          <button class="theme-opt" data-theme="rose">🌹 Rose</button>
        </div>
      </div>
      <button class="nav-pill" id="nav-settings" title="Settings">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="6.5" r="2" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 1v1.5M6.5 10.5V12M1 6.5h1.5M10.5 6.5H12M2.4 2.4l1.1 1.1M9.5 9.5l1.1 1.1M9.5 3.5l1.1-1.1M2.4 10.6l1.1-1.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <div id="nav-brand">Bengali Library</div>
    </div>
  </nav>

  <div id="layout">
    <main id="content"></main>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
